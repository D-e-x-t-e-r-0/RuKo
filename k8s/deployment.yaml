apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruko
  labels: { app: ruko }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ruko }
  template:
    metadata:
      labels: { app: ruko }
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: ruko
          image: ruko:1.2.0-pi
          ports:
            - containerPort: 4173
            - containerPort: 80
          env:
            - { name: PORT, value: "4173" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: RUKO_SESSION_FILE, value: "/data/sessions.json" }
          envFrom:
            - secretRef: { name: ruko-keys, optional: true }
          livenessProbe:
            httpGet: { path: /api/health, port: 4173 }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 4
          readinessProbe:
            httpGet: { path: /api/health, port: 4173 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
