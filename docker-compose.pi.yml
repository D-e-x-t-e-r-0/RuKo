# Ruko Pi compose — one command boot behind nginx
# Usage:
#   cp scripts/pi/env.pi.example .env
#   docker compose -f docker-compose.pi.yml up -d --build
#   curl http://<pi-ip>/api/telegram
services:
  ruko:
    build: .
    container_name: ruko
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4173
      HOST: 0.0.0.0
    ports:
      - "80:80"
      - "4173:4173"
    volumes:
      # persist nothing server-side by design (journal stays on device);
      # keep nginx logs on host for judges to tail
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4173/api/telegram"]
      interval: 30s
      timeout: 4s
      retries: 3
