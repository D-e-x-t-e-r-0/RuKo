# Ruko nginx reverse-proxy for Raspberry Pi
# Install: cp nginx/ruko.conf /etc/nginx/sites-available/ruko.conf
#          sed -i 's/ruko.local/<your-domain>/; s|/opt/ruko|<app-dir>|' /etc/nginx/sites-available/ruko.conf
#          nginx -t && systemctl reload nginx
#
# What it does:
#  - Serves Vite dist/ directly (fast, offline-friendly, cached PWA assets)
#  - Proxies /api/* to the Node server (Vite preview on 127.0.0.1:4173 serves both
#    static + /api via vite-plugin-dev-api in dev, and via server.js in prod on Pi)
#  - Rate-limits /api/ai and /api/telegram (20 req/hour logic also enforced in code)
#  - Security headers + gzip + 5s proxy timeouts so the 4s AI fallback always wins

upstream ruko_node {
  server 127.0.0.1:4173;
  keepalive 16;
}

limit_req_zone $binary_remote_addr zone=ruko_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ruko_ai:10m rate=5r/m;

server {
  listen 80;
  server_name ruko.local;
  root /opt/ruko/dist;
  index index.html;

  # PWA + static cache
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri @node;
  }
  location = /sw.js { expires 0; add_header Cache-Control "no-cache"; try_files $uri @node; }
  location = /manifest.webmanifest { expires 1d; try_files $uri @node; }

  # API with tight timeouts (client falls back to rules after 4s)
  location /api/ {
    limit_req zone=ruko_api burst=10 nodelay;
    proxy_pass http://ruko_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 4s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
  }
  location = /api/ai {
    limit_req zone=ruko_ai burst=5 nodelay;
    proxy_pass http://ruko_node;
    proxy_read_timeout 5s;
  }

  # Health for systemd / uptime checks (served by Node; falls through to index if static-only)
  location = /api/health {
    proxy_pass http://ruko_node;
    access_log off;
  }

  # SPA fallback — HashRouter works even as pure static files
  location / {
    try_files $uri $uri/ /index.html;
  }
  location @node {
    proxy_pass http://ruko_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Hardening headers (no cookies used; IndexedDB stays on device)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "microphone=(self), camera=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/ruko.access.log;
  error_log /var/log/nginx/ruko.error.log warn;
}
