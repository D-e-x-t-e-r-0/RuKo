# Ruko nginx config for the Docker setup (ruko-web service).
# Same edge policy as nginx/ruko.conf (rate limits, 4-5s timeouts, hardening
# headers), but everything is proxied to the ruko-app container — pi-server
# already serves dist/ with SPA fallback, so nginx needs no static root here.

upstream ruko_node {
  server ruko-app:4173;
  keepalive 16;
}

limit_req_zone $binary_remote_addr zone=ruko_api:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ruko_ai:10m rate=5r/m;

server {
  listen 80;
  server_name _;

  location /api/ {
    limit_req zone=ruko_api burst=10 nodelay;
    proxy_pass http://ruko_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 4s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
  }
  location = /api/ai {
    limit_req zone=ruko_ai burst=5 nodelay;
    proxy_pass http://ruko_node;
    proxy_read_timeout 5s;
  }
  location = /api/health {
    proxy_pass http://ruko_node;
    access_log off;
  }

  location / {
    proxy_pass http://ruko_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "microphone=(self), camera=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  access_log /var/log/nginx/ruko.access.log;
  error_log /var/log/nginx/ruko.error.log warn;
}
